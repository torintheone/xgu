# Runs the app on an Android emulator, photographs every screen and keeps the pictures in docs/screenshots,
# where README shows them. Runs whenever the app's code changes; the pictures are also kept as a build artifact.
name: Screenshots

on:
  push:
    branches: ['**']
    paths:
      - 'app/src/**'
      - 'sim/src/main/**'
      - 'scripts/screenshots.sh'
      - 'scripts/shrink_screenshots.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build the APK
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Photograph every screen on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/screenshots.sh app/build/outputs/apk/release/app-release.apk build/screenshots

      - name: Make the pictures small
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" scripts/shrink_screenshots.py build/screenshots docs/screenshots

      - name: Keep the pictures as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Save the pictures in the repository
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "The screenshots did not change."
            exit 0
          fi
          git commit -m "Скриншоты интерфейса для ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
